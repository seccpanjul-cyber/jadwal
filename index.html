
<!DOCTYPE html>
<html>
<head>
    <title>jadwal apa aja</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <h1>jadwal kegiatan</h1>

    <input type="text" id="agenda" placeholder="Nama agenda">
    <input type="date" id="tanggal">
    <input type="time" id="jam">

    <div class="tombol">
        <button onclick="tambah()">tambah jadwal</button>
        <button onclick="hapusSemua()">hapus</button>
    </div>

    <h2>daftar jadwal</h2>

    <ul id="kegiatan"></ul>

</div>

<script>

var kegiatan = document.getElementById("kegiatan");

function tambah() {

    var aa = document.getElementById("agenda").value;
    var tanggal = document.getElementById("tanggal").value;
    var jam = document.getElementById("jam").value;

    var data = document.createElement("li");

    data.innerHTML = aa + " - " + tanggal + " - " + jam;

    kegiatan.appendChild(data);
}

function hapusSemua() {
    kegiatan.innerHTML = "";
}

</script>

</body>
</html>
